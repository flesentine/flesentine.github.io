<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MS-DOS Defrag">
<title>Microsoft Defragmenter</title>
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overscroll-behavior:none}
#stage{position:relative;background:#000;touch-action:manipulation;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;aspect-ratio:8/5}
#controls{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;padding:0;opacity:0;transition:opacity .15s;z-index:2}
#stage:active #controls,#controls:focus-within{opacity:1}
button{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid #fff;background:#aaa;color:#000;padding:9px 10px;border-radius:0;box-shadow:2px 2px #000;min-width:78px}
@media(hover:hover){#stage:hover #controls{opacity:1}}
@media(orientation:landscape){
  #stage{width:min(100vw,calc(100dvh * 1.6));height:min(100dvh,calc(100vw / 1.6))}
  canvas{width:100%;height:100%}
}
@media(orientation:portrait){
  body{background:#0000aa}
  #stage{width:100vw;height:100dvh;background:#0000aa}
  canvas{position:absolute;left:0;top:50%;width:100vw;height:auto;transform:translateY(-50%)}
}
</style>
</head>
<body>
<div id="stage">
<canvas id="dos" width="640" height="400" aria-label="MS-DOS Defragmenter simulation"></canvas>
<div id="controls"><button id="start">START</button><button id="reset">SCRAMBLE</button><button id="sound">SOUND ON</button></div>
</div>
<script>
(()=>{
const c=document.getElementById('dos'),x=c.getContext('2d',{alpha:false});
const start=document.getElementById('start'),reset=document.getElementById('reset'),soundBtn=document.getElementById('sound');
const CW=8,CH=16,COLS=80,ROWS=25;
const pal=['#000000','#0000aa','#00aa00','#00aaaa','#aa0000','#aa00aa','#aa5500','#aaaaaa','#555555','#5555ff','#55ff55','#55ffff','#ff5555','#ff55ff','#ffff55','#ffffff'];
const mapW=76,mapH=13,mapX=2,mapY=4,N=mapW*mapH;
let cells=[],running=false,sound=true,read=-1,write=-1,progress=0,moved=0,pass=1,elapsed=0,last=0,file='COMMAND.COM',timer=0,audio;
const names=['COMMAND.COM','AUTOEXEC.BAT','CONFIG.SYS','HIMEM.SYS','EMM386.EXE','SMARTDRV.EXE','DOSKEY.COM','MOUSE.COM','QBASIC.EXE','EDIT.COM','DEFRAG.EXE','CHKDSK.EXE','MEM.EXE','MODE.COM','ANSI.SYS','README.TXT'];
function font(){x.font='16px "Courier New",monospace';x.textBaseline='top';x.textAlign='left'}
function cell(ch,col=7,bg=1,cx=0,cy=0){x.fillStyle=pal[bg];x.fillRect(cx*CW,cy*CH,CW,CH);x.fillStyle=pal[col];font();x.fillText(ch,cx*CW,cy*CH-1)}
function text(s,cx,cy,col=7,bg=1,max=80){for(let i=0;i<Math.min(s.length,max);i++)cell(s[i],col,bg,cx+i,cy)}
function fill(bg=1){x.fillStyle=pal[bg];x.fillRect(0,0,640,400)}
function box(x0,y0,w,h,title=''){text('╔'+'═'.repeat(w-2)+'╗',x0,y0,15,1);for(let y=1;y<h-1;y++){text('║',x0,y0+y,15,1);text('║',x0+w-1,y0+y,15,1)}text('╚'+'═'.repeat(w-2)+'╝',x0,y0+h-1,15,1);if(title)text(' '+title+' ',x0+2,y0,14,1)}
function init(){cells=Array(N).fill(0);for(let i=0;i<56;i++)cells[i]=4;for(let i=56;i<N;i++){let r=Math.random();cells[i]=r<.57?1:r<.68?2:r<.74?3:0}read=write=-1;progress=moved=elapsed=0;pass=1;running=false;file=names[0];draw()}
function glyph(v){return v===0?'░':v===1?'█':v===2?'▓':v===3?'▒':'X'}
function color(v){return v===0?9:v===1?15:v===2?12:v===3?11:14}
function draw(){fill(1);
text(' Optimize  Configure  Information ',0,0,0,11);text(' Microsoft Defragmenter ',29,1,15,1);text('Drive C:  LOCAL DISK',2,2,15,1);text(running?'Optimizing drive...':'Press ENTER to begin optimizing',42,2,running?14:7,1);
box(1,3,78,15,'Drive Map');
for(let i=0;i<N;i++){let xx=mapX+(i%mapW),yy=mapY+Math.floor(i/mapW);let ch=glyph(cells[i]),co=color(cells[i]);if(i===read){ch='r';co=0;cell(ch,co,14,xx,yy)}else if(i===write){ch='W';co=15;cell(ch,co,4,xx,yy)}else cell(ch,co,1,xx,yy)}
box(1,18,48,6,'Status');box(49,18,30,6,'Legend');
text('Current file : '+file.padEnd(25),3,19,15,1);text('Pass         : '+String(pass).padStart(3),3,20,15,1);text('Percent      : '+String(progress).padStart(3)+'%',3,21,15,1);text('Elapsed time : '+fmt(elapsed),3,22,15,1);
text('░ Free space',51,19,9,1);text('█ Used clusters',51,20,15,1);text('▓ Fragmented',51,21,12,1);text('X Unmovable',51,22,14,1);
text('Reading',2,24,7,0);text('Writing',13,24,7,0);text('Moved: '+String(moved).padStart(4),25,24,7,0);text('Esc Exit   F1 Help   Enter Optimize',43,24,7,0);
}
function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function beep(f=420,d=.025){if(!sound)return;try{audio ||= new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
function target(){let fixed=cells.filter(v=>v===4).length,used=cells.filter(v=>v===1||v===2||v===3).length;return cells.map((_,i)=>i<fixed?4:i<fixed+used?1:0)}
async function run(){if(running)return;running=true;start.textContent='RUNNING';let t=target(),changes=[];for(let i=0;i<N;i++)if(cells[i]!==t[i])changes.push(i);last=performance.now();timer=requestAnimationFrame(clock);
for(let k=0;k<changes.length;k++){let i=changes[k];read=i;write=-1;file=names[(k>>2)%names.length];draw();beep(300+(k%6)*35);await wait(18+Math.random()*52);if(!running)break;write=i;read=-1;draw();beep(580+(k%5)*45);await wait(12+Math.random()*36);cells[i]=t[i];write=-1;moved++;progress=Math.round((k+1)/changes.length*100);if(k&&k%90===0)pass++;draw()}
running=false;cancelAnimationFrame(timer);read=write=-1;progress=100;start.textContent='START';beep(900,.12);draw()}
function clock(now){if(!running)return;elapsed+=now-last;last=now;draw();timer=requestAnimationFrame(clock)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
start.onclick=run;reset.onclick=init;soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'SOUND ON':'SOUND OFF';if(sound)beep(700,.06)};
document.addEventListener('keydown',e=>{if(e.key==='Enter')run();if(e.key==='Escape'){running=false;start.textContent='START'}if(e.key==='F5')init()});
c.addEventListener('pointerup',()=>running?null:run());
init();
})();
</script>
</body>
</html>
