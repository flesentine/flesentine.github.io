<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0000aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DOS Defrag">
<title>Microsoft Defrag</title>
<style>
:root{--blue:#0000aa;--navy:#000055;--black:#000;--gray:#aaa;--white:#fff;--cyan:#55ffff;--yellow:#ffff55;--green:#55ff55;--red:#ff5555;--magenta:#ff55ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--gray);font-family:"Courier New",Courier,monospace;font-weight:700}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;font-weight:700}
.screen{width:100%;height:100%;max-width:900px;margin:auto;background:var(--blue);display:grid;grid-template-rows:auto auto auto 1fr auto auto;border:4px solid var(--gray);box-shadow:inset 0 0 0 2px #000}
.titlebar{background:var(--gray);color:#000;text-align:center;padding:4px 8px;font-size:clamp(12px,3.8vw,18px);white-space:nowrap}
.menubar{display:flex;gap:1.25rem;padding:5px 10px 4px;color:var(--white);font-size:clamp(11px,3.2vw,15px);border-bottom:2px solid var(--gray)}
.hot{color:var(--yellow)}
.driveLine{display:flex;justify-content:space-between;gap:10px;padding:7px 10px 5px;color:var(--white);font-size:clamp(11px,3vw,14px);white-space:nowrap}
.panel{min-height:0;margin:0 8px 6px;padding:4px;border:2px solid var(--white);box-shadow:2px 2px 0 #000,-2px -2px 0 var(--gray);display:grid;grid-template-rows:auto 1fr auto;gap:5px;background:var(--blue)}
.panelTitle{color:var(--yellow);text-align:center;font-size:clamp(11px,3vw,14px)}
.gridWrap{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:1fr;gap:2px;padding:2px;background:#000;border:2px solid #000;touch-action:none;user-select:none}
.cell{min-width:0;min-height:0;background:var(--navy);border:1px solid #000;transition:none}
.cell.used{background:var(--cyan)}.cell.fragment{background:var(--red)}.cell.system{background:var(--magenta)}.cell.moving{background:var(--yellow)}.cell.done{background:var(--green)}.cell.selected{outline:2px solid var(--white);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 14px;color:var(--white);font-size:clamp(9px,2.5vw,12px);padding:2px 0}
.key{display:flex;align-items:center;gap:5px}.dot{width:11px;height:9px;border:1px solid #000;display:inline-block}.free{background:var(--navy)}
.statusBox{margin:0 8px 6px;border:2px solid var(--gray);padding:5px 8px;color:var(--white);font-size:clamp(10px,2.7vw,13px);background:var(--navy)}
.statusRow{display:flex;justify-content:space-between;gap:8px}
.progressShell{height:16px;margin-top:5px;background:#000;border:2px solid var(--gray);padding:2px}
.progress{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--green) 0 8px,#000 8px 10px);transition:none}
.controls{display:grid;grid-template-columns:1fr 1.35fr 1fr 54px;gap:6px;padding:0 8px 8px}
.btn{min-height:46px;border:2px solid #000;background:var(--gray);color:#000;box-shadow:inset 2px 2px 0 var(--white),inset -2px -2px 0 #555;border-radius:0;padding:5px 4px;font-size:clamp(10px,2.8vw,13px)}
.btn.primary{background:var(--white)}.btn:active{box-shadow:inset 2px 2px 0 #555,inset -2px -2px 0 var(--white)}.btn:disabled{color:#555;background:#888}
.footer{color:var(--white);background:#000;padding:4px 8px;font-size:clamp(9px,2.5vw,12px);text-align:center}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--gray);color:#000;border:3px double #000;padding:12px 18px;font-size:13px;opacity:0;pointer-events:none;white-space:nowrap;box-shadow:6px 6px 0 #000}.toast.show{opacity:1}
@media(max-height:700px){.menubar{padding:3px 8px}.driveLine{padding:4px 8px}.panel{margin-bottom:4px}.controls{padding-bottom:4px}.btn{min-height:40px}.statusBox{padding:3px 7px}}
@media(min-width:650px){.grid{grid-template-columns:repeat(16,1fr)}.controls{grid-template-columns:1fr 1.4fr 1fr 70px}}
</style>
</head>
<body>
<main class="screen">
<div class="titlebar">Microsoft Defragmenter</div>
<div class="menubar"><span><span class="hot">D</span>rive</span><span><span class="hot">S</span>ettings</span><span><span class="hot">H</span>elp</span></div>
<div class="driveLine"><span>Drive C: LOCAL DISK</span><span id="status">READY</span></div>
<section class="panel">
<div class="panelTitle">DRIVE MAP</div>
<div class="gridWrap"><div id="grid" class="grid" aria-label="Disk block map"></div></div>
<div class="legend">
<span class="key"><i class="dot free"></i>Free space</span>
<span class="key"><i class="dot" style="background:var(--cyan)"></i>Used</span>
<span class="key"><i class="dot" style="background:var(--red)"></i>Fragmented</span>
<span class="key"><i class="dot" style="background:var(--magenta)"></i>System</span>
<span class="key"><i class="dot" style="background:var(--green)"></i>Optimized</span>
</div>
</section>
<section class="statusBox">
<div class="statusRow"><span>Fragmentation: <b id="fragValue">--%</b></span><span>Files moved: <b id="movedValue">0</b></span></div>
<div class="statusRow" style="margin-top:3px"><span>Drive status: <b id="healthValue">GOOD</b></span><span>Press START to optimize</span></div>
<div class="progressShell"><div id="progress" class="progress"></div></div>
</section>
<section class="controls">
<button id="shuffleBtn" class="btn">F5 SCRAMBLE</button>
<button id="startBtn" class="btn primary">ENTER START</button>
<button id="modeBtn" class="btn">F2 AUTO</button>
<button id="soundBtn" class="btn" aria-label="Toggle sound">♪</button>
</section>
<div class="footer">ESC Exit &nbsp; F1 Help &nbsp; ENTER Select</div>
</main>
<div id="toast" class="toast">Drive optimized</div>
<script>
(() => {
  const gridEl = document.querySelector('#grid');
  const startBtn = document.querySelector('#startBtn');
  const shuffleBtn = document.querySelector('#shuffleBtn');
  const modeBtn = document.querySelector('#modeBtn');
  const soundBtn = document.querySelector('#soundBtn');
  const statusEl = document.querySelector('#status');
  const fragEl = document.querySelector('#fragValue');
  const movedEl = document.querySelector('#movedValue');
  const healthEl = document.querySelector('#healthValue');
  const progressEl = document.querySelector('#progress');
  const toastEl = document.querySelector('#toast');

  let cells = [], data = [], running = false, manual = false, sound = true, selected = null, moved = 0;
  let audioCtx;
  const cellCount = () => matchMedia('(min-width:650px)').matches ? 128 : 120;

  function beep(freq=520, duration=.045) {
    if (!sound) return;
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='square'; o.frequency.value=freq; g.gain.setValueAtTime(.035,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+duration);
    } catch {}
  }

  function makeDisk() {
    const n = cellCount(); data = Array(n).fill('free');
    const systemCount = 8, usedCount = Math.floor(n*.62);
    for (let i=0;i<systemCount;i++) data[i]='system';
    let placed=0;
    while(placed<usedCount){
      const i=systemCount+Math.floor(Math.random()*(n-systemCount));
      if(data[i]==='free'){ data[i]=Math.random()<.34?'fragment':'used'; placed++; }
    }
    moved=0; selected=null; render(); updateStats(); progressEl.style.width='0%'; statusEl.textContent='READY';
  }

  function render() {
    if(cells.length!==data.length){
      gridEl.innerHTML=''; cells=data.map((_,i)=>{
        const d=document.createElement('div'); d.className='cell'; d.dataset.i=i;
        d.addEventListener('pointerdown', onCellTap); gridEl.appendChild(d); return d;
      });
    }
    cells.forEach((c,i)=>{c.className='cell '+data[i]+(selected===i?' selected':'');});
  }

  function fragmentation(){
    let breaks=0, used=0, seenFree=false;
    for(const x of data){
      if(x==='free') seenFree=true;
      else if(x!=='system'){used++; if(seenFree) breaks++;}
    }
    return used ? Math.round((breaks/used)*100) : 0;
  }

  function updateStats(){
    const f=fragmentation(); fragEl.textContent=f+'%'; movedEl.textContent=moved;
    healthEl.textContent=f<8?'EXCELLENT':f<22?'GOOD':f<40?'FAIR':'POOR';
    healthEl.style.color=f<22?'var(--green)':f<40?'var(--yellow)':'var(--red)';
  }

  function targetLayout(){
    const system=data.filter(x=>x==='system').length;
    const files=data.filter(x=>x==='used'||x==='fragment').length;
    return data.map((_,i)=>i<system?'system':i<system+files?'done':'free');
  }

  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  async function autoDefrag(){
    if(running) return; running=true; manual=false; lock(true); statusEl.textContent='ANALYZING'; beep(330,.08); await sleep(450);
    const target=targetLayout(); const changes=[];
    for(let i=0;i<data.length;i++) if(data[i]!==target[i]) changes.push(i);
    statusEl.textContent='OPTIMIZING';
    for(let step=0;step<changes.length;step++){
      const i=changes[step]; cells[i].classList.add('moving'); beep(420+(step%7)*45,.025); await sleep(28);
      data[i]=target[i]; moved++; render(); updateStats(); progressEl.style.width=Math.round(((step+1)/changes.length)*100)+'%';
    }
    finish();
  }

  function finish(){ running=false; lock(false); statusEl.textContent='COMPLETE'; progressEl.style.width='100%'; updateStats(); beep(740,.12); navigator.vibrate?.([30,40,60]); toast('Drive optimized'); }
  function lock(v){startBtn.disabled=v;shuffleBtn.disabled=v;modeBtn.disabled=v;startBtn.textContent=v?'WORKING…':'START DEFRAG'}
  function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1500)}

  function onCellTap(e){
    if(running || !manual) return;
    const i=+e.currentTarget.dataset.i;
    if(selected===null){
      if(data[i]==='used'||data[i]==='fragment'||data[i]==='done'){selected=i;beep(600);render();}
    } else {
      if(data[i]==='free'){
        data[i]=data[selected]==='done'?'used':data[selected]; data[selected]='free'; moved++; selected=null; beep(780); render(); updateStats();
        const f=fragmentation(); progressEl.style.width=Math.max(0,100-f*2)+'%'; if(f===0) finish();
      } else {selected=null;render();}
    }
  }

  startBtn.addEventListener('click',()=> manual ? toast('Tap a file, then a free block') : autoDefrag());
  shuffleBtn.addEventListener('click',()=>{if(!running){makeDisk();beep(250,.06)}});
  modeBtn.addEventListener('click',()=>{if(running)return;manual=!manual;modeBtn.textContent=manual?'MANUAL':'AUTO';startBtn.textContent=manual?'HOW TO PLAY':'START DEFRAG';statusEl.textContent=manual?'TAP TO MOVE':'READY';toast(manual?'Tap a file, then a free block':'Automatic mode');});
  soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=sound?'🔊':'🔇';if(sound)beep(600)});
  addEventListener('resize',()=>{const n=cellCount();if(n!==data.length)makeDisk()});
  document.addEventListener('touchmove',e=>{if(e.target.closest('.grid'))e.preventDefault()},{passive:false});
  makeDisk();
})();
</script>
</body>
</html>
