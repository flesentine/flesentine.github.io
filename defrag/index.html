<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0000aa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><title>Microsoft Defrag</title><style>:root{--blue:#5555ff;--cyan:#55ffff;--navy:#0000aa;--white:#fff;--yellow:#ffff55;--black:#000;--red:#aa0000}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"Courier New",monospace;font-weight:700}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button{font:inherit}.dos{height:100%;background:var(--blue);color:var(--white);display:grid;grid-template-rows:auto 1fr auto auto;min-height:0}.menu{height:28px;background:var(--cyan);color:#000;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-size:clamp(12px,2.7vw,17px);white-space:nowrap}.menu span{padding:3px 9px}.menu .active{background:#000;color:#fff}.mapFrame{min-height:0;padding:8px 10px 4px;display:flex;align-items:stretch}.map{width:100%;height:100%;display:grid;gap:0;background:var(--blue);touch-action:none;user-select:none;align-content:stretch}.cell{display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1;font-size:clamp(10px,2.2vw,18px);color:#fff}.cell.unmovable{color:var(--yellow)}.cell.writing{color:var(--yellow)}.cell.bad{color:#ff5555}.cell.selected{background:#000}.lower{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;padding:0 6% 8px;align-items:stretch}.box{position:relative;border:2px solid #fff;padding:16px 10px 9px;min-height:110px}.boxTitle{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--blue);padding:0 9px;font-size:clamp(12px,2.8vw,17px)}.statusRow{display:flex;justify-content:space-between;font-size:clamp(11px,2.7vw,16px)}.bar{height:18px;background:#fff;margin:7px 0 8px;padding:2px}.barFill{height:100%;width:0;background:repeating-linear-gradient(90deg,#aaa 0 4px,#fff 4px 6px)}.center{text-align:center;font-size:clamp(11px,2.7vw,16px);line-height:1.35}.legend{font-size:clamp(10px,2.5vw,15px);line-height:1.35}.footer{background:var(--cyan);color:var(--red);font-size:clamp(10px,2.6vw,15px);padding:5px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}.controls{display:flex;gap:6px}.controls button{border:0;border-radius:0;background:#000;color:#fff;padding:3px 7px;min-width:48px}@media(max-width:600px) and (orientation:portrait){.mapFrame{padding:5px 5px 2px}.lower{grid-template-columns:1fr;gap:12px;padding:0 5px 6px}.box{min-height:86px;padding-top:13px}.legend{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}.menu{height:25px;padding:0 3px}.menu span{padding:2px 5px}.footer{padding:4px 5px}.footer .hint{display:none}}@media(orientation:landscape) and (max-height:500px){.menu{height:24px}.mapFrame{padding:4px 8px 2px}.lower{padding:0 5% 5px;gap:14px}.box{min-height:90px;padding-top:13px}.footer{padding:3px 7px}.cell{font-size:clamp(8px,2.5vh,15px)}}</style></head><body><main class="dos"><header class="menu"><div><span class="active">Optimize</span><span>Configure</span><span>Information</span></div><span>Esc=Stop</span></header><section class="mapFrame"><div id="map" class="map" aria-label="Drive cluster map"></div></section><section class="lower"><div class="box"><div class="boxTitle">Status</div><div class="statusRow"><span>Cluster <b id="cluster">2</b></span><span><b id="pct">0</b>%</span></div><div class="bar"><div id="barFill" class="barFill"></div></div><div class="center">Elapsed Time: <span id="elapsed">00:00:00</span><br>Full Optimization</div></div><div class="box"><div class="boxTitle">Legend</div><div class="legend"><div>■ - Used</div><div>r - Reading</div><div>W - Writing</div><div>B - Bad</div><div>X - Unmovable</div><div>Drive C: &nbsp;1 block = <span id="blockSize">41</span> clusters</div></div></div></section><footer class="footer"><span class="hint">Press ENTER to start optimizing drive C:</span><div class="controls"><button id="shuffle">Scramble</button><button id="start">Start</button></div></footer></main><script>(()=>{const map=document.getElementById('map'),pct=document.getElementById('pct'),bar=document.getElementById('barFill'),cluster=document.getElementById('cluster'),elapsed=document.getElementById('elapsed'),start=document.getElementById('start'),shuffle=document.getElementById('shuffle'),blockSize=document.getElementById('blockSize');let data=[],running=false,timer=null,seconds=0;function dims(){const portrait=innerHeight>innerWidth;return portrait?{c:32,r:15}:{c:56,r:15}}function randomDisk(){const {c,r}=dims();data=[];for(let i=0;i<c*r;i++){if(i<c*2)data.push(Math.random()<.92?'unmovable':'free');else{const q=Math.random();data.push(q<.67?'used':q<.95?'free':'bad')}}render();setProgress(0);cluster.textContent='2';seconds=0;elapsed.textContent='00:00:00';blockSize.textContent=innerHeight>innerWidth?54:41}function render(active=-1,mode=''){const {c,r}=dims();map.style.gridTemplateColumns=`repeat(${c},1fr)`;map.style.gridTemplateRows=`repeat(${r},1fr)`;map.innerHTML='';data.forEach((v,i)=>{const s=document.createElement('span');s.className='cell '+v+(i===active?' selected':'');s.textContent=i===active?(mode==='read'?'r':'W'):(v==='free'?'░':v==='used'?'■':v==='unmovable'?'X':'B');map.appendChild(s)})}function setProgress(n){pct.textContent=n;bar.style.width=n+'%'}function fmt(s){return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}async function optimize(){if(running)return;running=true;start.disabled=true;seconds=0;timer=setInterval(()=>{seconds++;elapsed.textContent=fmt(seconds)},1000);const movable=[];for(let i=0;i<data.length;i++)if(data[i]==='used')movable.push(i);const fixed=data.filter(x=>x==='unmovable').length;const target=data.map((_,i)=>i<fixed?'unmovable':i<fixed+movable.length?'used':'free');const changes=[];for(let i=0;i<data.length;i++)if(data[i]!==target[i])changes.push(i);for(let n=0;n<changes.length;n++){const i=changes[n];render(i,'read');await new Promise(r=>setTimeout(r,24));data[i]=target[i];render(i,'write');setProgress(Math.round((n+1)/changes.length*100));cluster.textContent=(i+2).toLocaleString();await new Promise(r=>setTimeout(r,24))}data=target;render();setProgress(100);clearInterval(timer);running=false;start.disabled=false;start.textContent='Again'}start.onclick=optimize;shuffle.onclick=()=>{if(!running){start.textContent='Start';randomDisk()}};addEventListener('resize',()=>{if(!running)randomDisk()});document.addEventListener('keydown',e=>{if(e.key==='Enter')optimize();if(e.key==='Escape'&&running)location.reload()});randomDisk()})();</script></body></html>
