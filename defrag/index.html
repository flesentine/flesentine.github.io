<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#5555ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Microsoft Defrag</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5555ff}body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}#stage{position:relative;background:#5555ff;overflow:hidden;touch-action:manipulation}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}#controls{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;opacity:0;z-index:2}#stage:active #controls,#controls:focus-within{opacity:1}button{font:700 12px monospace;border:1px solid #000;background:#fff;color:#000;padding:8px;border-radius:0}@media(orientation:landscape){#stage{width:min(100vw,calc(100dvh * 1.8));height:min(100dvh,calc(100vw / 1.8))}}@media(orientation:portrait){#stage{width:100vw;height:100dvh}}</style></head><body><div id="stage"><canvas id="dos"></canvas><div id="controls"><button id="start">START</button><button id="reset">SCRAMBLE</button><button id="sound">SOUND ON</button></div></div><script>(()=>{const c=document.getElementById('dos'),g=c.getContext('2d',{alpha:false}),start=document.getElementById('start'),reset=document.getElementById('reset'),soundBtn=document.getElementById('sound');const P={black:'#000',blue:'#5555ff',white:'#fff',yellow:'#ffff55',red:'#aa0000',cyan:'#55ffff'};let CW=8,CH=16,COLS=90,ROWS=25,mapW=86,mapH=15,N=0,cells=[],ids=[],running=false,sound=true,read=-1,write=-1,scan=-1,progress=0,moved=0,elapsed=0,last=0,phase='Ready',file='COMMAND.COM',timer=0,audio;const names=['COMMAND.COM','AUTOEXEC.BAT','CONFIG.SYS','HIMEM.SYS','EMM386.EXE','SMARTDRV.EXE','DOSKEY.COM','MOUSE.COM','QBASIC.EXE','EDIT.COM','DEFRAG.EXE','CHKDSK.EXE','MEM.EXE','MODE.COM','ANSI.SYS','README.TXT','WIN.COM','KRNL386.EXE','GDI.EXE','USER.EXE'];function layout(){const p=matchMedia('(orientation:portrait)').matches;COLS=p?60:90;ROWS=p?Math.max(42,Math.round(COLS*innerHeight/innerWidth/2)):25;mapW=COLS-4;mapH=ROWS-10;N=mapW*mapH;c.width=COLS*CW;c.height=ROWS*CH}function fill(color=P.blue){g.fillStyle=color;g.fillRect(0,0,c.width,c.height)}function font(){g.font='16px monospace';g.textBaseline='top'}function txt(s,x,y,fg=P.white,bg=null,max=COLS){font();for(let i=0;i<Math.min(s.length,max);i++){if(bg){g.fillStyle=bg;g.fillRect((x+i)*CW,y*CH,CW,CH)}g.fillStyle=fg;g.fillText(s[i],(x+i)*CW,y*CH-1)}}function box(x,y,w,h,title=''){txt('┌'+'─'.repeat(w-2)+'┐',x,y);for(let j=1;j<h-1;j++){txt('│',x,y+j);txt('│',x+w-1,y+j)}txt('└'+'─'.repeat(w-2)+'┘',x,y+h-1);if(title)txt(' '+title+' ',x+2,y)}function cluster(x,y,type,active=''){const px=x*CW,py=y*CH;g.fillStyle=P.blue;g.fillRect(px,py,CW,CH);if(active==='read'){g.fillStyle=P.white;g.fillRect(px,py,CW,CH);txt('r',x,y,P.black);return}if(active==='write'){g.fillStyle=P.red;g.fillRect(px,py,CW,CH);txt('W',x,y,P.white);return}if(type===4){g.fillStyle=P.yellow;g.fillRect(px+1,py+3,6,9);g.fillStyle=P.blue;g.fillRect(px+3,py+5,2,5);return}if(type===3){txt('B',x,y,P.white);return}if(type===0){g.fillStyle=P.white;for(let yy=3;yy<13;yy+=3)for(let xx=1;xx<7;xx+=3)g.fillRect(px+xx,py+yy,1,1);return}if(type===2){g.fillStyle=P.white;for(let yy=2;yy<14;yy+=2)for(let xx=(yy%4?1:2);xx<7;xx+=2)g.fillRect(px+xx,py+yy,1,1);return}g.fillStyle=P.white;g.fillRect(px+1,py+2,6,11);g.fillStyle=P.blue;g.fillRect(px+2,py+3,4,9)}function bar(x,y,w,pct){g.fillStyle=P.white;g.fillRect(x*CW,y*CH,w*CW,CH);g.fillStyle=P.blue;g.fillRect(x*CW+2,y*CH+3,w*CW-4,10);g.fillStyle=P.white;g.fillRect(x*CW+2,y*CH+3,Math.round((w*CW-4)*pct/100),10)}function init(){layout();cells=Array(N).fill(0);ids=Array(N).fill(-1);const fixed=Math.min(mapW*2,N);for(let i=0;i<fixed;i++)cells[i]=4;let p=fixed,id=0;while(p<N){if(Math.random()<.12){p+=1+Math.floor(Math.random()*4);continue}const len=2+Math.floor(Math.random()*10);for(let j=0;j<len&&p<N;j++,p++){const r=Math.random();cells[p]=r<.01?3:r<.18?2:1;ids[p]=id}id=(id+1)%names.length}read=write=scan=-1;progress=moved=elapsed=0;phase='Ready';file=names[0];running=false;start.textContent='START';draw()}function draw(){fill();const portrait=COLS===60;g.fillStyle=P.white;g.fillRect(0,0,c.width,CH);g.fillStyle=P.black;g.fillRect(3*CW,0,17*CW,CH);txt('Optimize',7,0,P.white);txt('Esc=Stop',COLS-10,0,P.black,P.white);for(let i=0;i<N;i++){const x=2+i%mapW,y=2+Math.floor(i/mapW);cluster(x,y,cells[i],i===read?'read':i===write?'write':'')}const sy=mapH+3;if(portrait){box(3,sy,COLS-6,6,'Status');txt('Cluster '+String(Math.max(2,Math.round(progress*N/100))).padStart(5),5,sy+1);txt(String(progress).padStart(3)+'%',COLS-10,sy+1);bar(7,sy+2,COLS-14,progress);txt('Elapsed Time: '+fmt(elapsed),10,sy+3);txt('Full Optimization',14,sy+4);txt('■ Used  r Read  W Write  B Bad  X Fixed',2,sy+6)}else{box(6,sy,52,6,'Status');box(61,sy,27,7,'Legend');txt('Cluster '+String(Math.max(2,Math.round(progress*N/100))).padStart(5),8,sy+1);txt(String(progress).padStart(3)+'%',50,sy+1);bar(12,sy+2,40,progress);txt('Elapsed Time: '+fmt(elapsed),18,sy+3);txt('Full Optimization',22,sy+4);txt('■ - Used',63,sy+1);txt('r - Reading',63,sy+2);txt('W - Writing',63,sy+3);txt('B - Bad   X - Unmovable',63,sy+4);txt('Drive C: 1 block=41 clusters',63,sy+5)}g.fillStyle=P.white;g.fillRect(0,(ROWS-1)*CH,c.width,CH);txt((running?phase+' '+file:'Press ENTER to begin optimization').padEnd(COLS),0,ROWS-1,P.red,P.white);if(!portrait)txt('Microsoft Defrag',COLS-18,ROWS-1,P.black,P.white)}function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function beep(f=420,d=.02){if(!sound)return;try{audio||=new(AudioContext||webkitAudioContext)();let o=audio.createOscillator(),a=audio.createGain();o.type='square';o.frequency.value=f;a.gain.value=.015;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}const wait=ms=>new Promise(r=>setTimeout(r,ms));function fixedEnd(){let i=0;while(i<N&&cells[i]===4)i++;return i}function hole(from){for(let i=from;i<N;i++)if(cells[i]===0)return i;return-1}function used(from){for(let i=from;i<N;i++)if(cells[i]===1||cells[i]===2)return i;return-1}function runLen(s){const id=ids[s];let n=0;while(s+n<N&&ids[s+n]===id&&(cells[s+n]===1||cells[s+n]===2))n++;return Math.max(1,n)}async function analyze(){phase='Analyzing';for(let i=0;i<N;i+=Math.max(1,Math.floor(mapW/4))){scan=i;progress=Math.min(5,Math.round(i/N*5));draw();await wait(18+Math.random()*25)}scan=-1;await wait(180)}async function run(){if(running)return;running=true;start.textContent='RUNNING';last=performance.now();timer=requestAnimationFrame(clock);await analyze();let left=fixedEnd(),ops=0,total=cells.filter(v=>v===1||v===2).length;while(running){let dst=hole(left),src=used(dst+1);if(dst<0||src<0)break;const len=Math.min(runLen(src),1+Math.floor(Math.random()*6));file=names[(ids[src]>=0?ids[src]:ops)%names.length];phase='Reading';for(let j=0;j<len;j++){read=src+j;write=-1;draw();beep(300+j*25);await wait(22+Math.random()*38)}phase='Writing';for(let j=0;j<len&&dst+j<src;j++){read=-1;write=dst+j;draw();beep(560+j*30);await wait(18+Math.random()*30);cells[dst+j]=1;ids[dst+j]=ids[src+j];cells[src+j]=0;ids[src+j]=-1;moved++;draw()}read=write=-1;ops++;progress=Math.min(99,5+Math.round(moved/Math.max(1,total)*95));if(ops%12===0){phase='Updating';draw();await wait(150+Math.random()*220)}left=dst+len}running=false;cancelAnimationFrame(timer);phase='Complete';progress=100;read=write=scan=-1;start.textContent='START';beep(900,.12);draw()}function clock(now){if(!running)return;elapsed+=now-last;last=now;draw();timer=requestAnimationFrame(clock)}start.onclick=run;reset.onclick=init;soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'SOUND ON':'SOUND OFF'};c.addEventListener('pointerup',()=>running?null:run());addEventListener('resize',()=>{if(!running)init()});document.addEventListener('keydown',e=>{if(e.key==='Enter')run();if(e.key==='Escape'){running=false;phase='Stopped';start.textContent='START';draw()}if(e.key==='F5')init()});init()})()</script></body></html>
