<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#5555ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MS-DOS Defrag"><title>Microsoft Defragmenter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5555ff}body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overscroll-behavior:none}#stage{position:relative;background:#5555ff;touch-action:manipulation;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#5555ff}#controls{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;opacity:0;z-index:2}#stage:active #controls,#controls:focus-within{opacity:1}button{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid #000;background:#fff;color:#000;padding:9px 10px;border-radius:0;box-shadow:2px 2px #000;min-width:78px}@media(hover:hover){#stage:hover #controls{opacity:1}}@media(orientation:landscape){#stage{width:min(100vw,calc(100dvh * 1.8));height:min(100dvh,calc(100vw / 1.8))}}@media(orientation:portrait){#stage{width:100vw;height:100dvh}}
</style></head><body><div id="stage"><canvas id="dos" width="720" height="400" aria-label="MS-DOS Defragmenter simulation"></canvas><div id="controls"><button id="start">START</button><button id="reset">SCRAMBLE</button><button id="sound">SOUND ON</button></div></div>
<script>
(()=>{
const c=document.getElementById('dos'),x=c.getContext('2d',{alpha:false});
const start=document.getElementById('start'),reset=document.getElementById('reset'),soundBtn=document.getElementById('sound');
let CW=10,CH=20,COLS=72,ROWS=20,mapW=68,mapH=12,mapX=2,mapY=2,N=816;
const pal=['#000000','#0000aa','#00aa00','#00aaaa','#aa0000','#aa00aa','#aa5500','#aaaaaa','#555555','#5555ff','#55ff55','#55ffff','#ff5555','#ff55ff','#ffff55','#ffffff'];
const BG=9,WHITE=15,BLACK=0,YELLOW=14,RED=4;
const names=['COMMAND.COM','AUTOEXEC.BAT','CONFIG.SYS','HIMEM.SYS','EMM386.EXE','SMARTDRV.EXE','DOSKEY.COM','MOUSE.COM','QBASIC.EXE','EDIT.COM','DEFRAG.EXE','CHKDSK.EXE','MEM.EXE','MODE.COM','ANSI.SYS','README.TXT','WIN.COM','KRNL386.EXE','GDI.EXE','USER.EXE'];
let cells=[],fileId=[],running=false,sound=true,read=-1,write=-1,scan=-1,progress=0,moved=0,pass=1,elapsed=0,last=0,file='COMMAND.COM',phase='Ready',timer=0,audio;
function layout(){const p=matchMedia('(orientation:portrait)').matches;COLS=p?60:72;ROWS=p?Math.max(38,Math.round(COLS*innerHeight/innerWidth/2)):20;mapW=COLS-4;mapH=ROWS-8;mapX=2;mapY=2;N=mapW*mapH;c.width=COLS*CW;c.height=ROWS*CH}
function font(){x.font=CH+'px "Courier New",monospace';x.textBaseline='top';x.textAlign='left'}
function cell(ch,col=WHITE,bg=BG,cx=0,cy=0){x.fillStyle=pal[bg];x.fillRect(cx*CW,cy*CH,CW,CH);x.fillStyle=pal[col];font();x.fillText(ch,cx*CW,cy*CH-1)}
function text(s,cx,cy,col=WHITE,bg=BG,max=COLS){for(let i=0;i<Math.min(s.length,max);i++)cell(s[i],col,bg,cx+i,cy)}
function fill(bg=BG){x.fillStyle=pal[bg];x.fillRect(0,0,c.width,c.height)}
function box(x0,y0,w,h,title=''){text('┌'+'─'.repeat(w-2)+'┐',x0,y0,WHITE,BG);for(let y=1;y<h-1;y++){text('│',x0,y0+y,WHITE,BG);text('│',x0+w-1,y0+y,WHITE,BG)}text('└'+'─'.repeat(w-2)+'┘',x0,y0+h-1,WHITE,BG);if(title)text(' '+title+' ',x0+2,y0,WHITE,BG)}
function init(){layout();cells=Array(N).fill(0);fileId=Array(N).fill(-1);const fixed=Math.min(mapW,N);for(let i=0;i<fixed;i++)cells[i]=4;let pos=fixed,id=0;while(pos<N){if(Math.random()<.25){pos+=1+Math.floor(Math.random()*6);continue}let len=2+Math.floor(Math.random()*10);for(let j=0;j<len&&pos<N;j++,pos++){cells[pos]=Math.random()<.015?3:1;fileId[pos]=id}id=(id+1)%names.length;if(Math.random()<.42)pos+=1+Math.floor(Math.random()*4)}read=write=scan=-1;progress=moved=elapsed=0;pass=1;phase='Ready';running=false;file=names[0];start.textContent='START';draw()}
function glyph(v){return v===0?' ':v===1?'■':v===2?'■':v===3?'B':'X'}
function color(v){return v===4?YELLOW:WHITE}
function draw(){fill(BG);const p=COLS===60;
text(' Optimize ',0,0,BLACK,WHITE);text('Esc=Stop',COLS-8,0,WHITE,BLACK);
for(let i=0;i<N;i++){let xx=mapX+i%mapW,yy=mapY+Math.floor(i/mapW),ch=glyph(cells[i]),co=color(cells[i]),bg=BG;if(i===scan){ch='·';co=WHITE}else if(i===read){ch='r';co=BLACK;bg=WHITE}else if(i===write){ch='W';co=WHITE;bg=RED}cell(ch,co,bg,xx,yy)}
const sy=mapH+3;if(p){box(2,sy,COLS-4,5,'Status');text('Cluster '+String(Math.max(2,Math.round(progress*N/100))).padStart(5)+'     '+String(progress).padStart(3)+'%',4,sy+1,WHITE,BG);text('Elapsed Time: '+fmt(elapsed),12,sy+2,WHITE,BG);text('Full Optimization',17,sy+3,WHITE,BG);text('■ Used  r Read  W Write  B Bad  X Fixed',3,sy+5,WHITE,BG)}else{box(5,sy,42,5,'Status');box(49,sy,21,5,'Legend');text('Cluster '+String(Math.max(2,Math.round(progress*N/100))).padStart(5),7,sy+1,WHITE,BG);text(String(progress).padStart(3)+'%',41,sy+1,WHITE,BG);text('Elapsed Time: '+fmt(elapsed),12,sy+2,WHITE,BG);text('Full Optimization',16,sy+3,WHITE,BG);text('■ - Used',51,sy+1,WHITE,BG);text('r - Reading',51,sy+2,WHITE,BG);text('W - Writing',51,sy+3,WHITE,BG)}
text(running?phase+' '+file:'Press ENTER to begin optimization',1,ROWS-1,RED,WHITE,COLS-1)}
function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function beep(f=420,d=.02){if(!sound)return;try{audio ||= new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.02;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));function fixedEnd(){let i=0;while(i<N&&cells[i]===4)i++;return i}function firstHole(from){for(let i=from;i<N;i++)if(cells[i]===0)return i;return -1}function nextUsed(from){for(let i=from;i<N;i++)if(cells[i]===1||cells[i]===2)return i;return -1}function runLength(s){let id=fileId[s],n=0;while(s+n<N&&fileId[s+n]===id&&(cells[s+n]===1||cells[s+n]===2))n++;return Math.max(1,n)}
async function analyze(){phase='Analyzing';for(let i=0;i<N;i+=Math.max(1,Math.floor(mapW/3))){scan=i;progress=Math.min(8,Math.round(i/N*8));draw();beep(220+(i%5)*25,.01);await wait(22+Math.random()*28)}scan=-1;draw();await wait(220)}
async function run(){if(running)return;running=true;start.textContent='RUNNING';last=performance.now();timer=requestAnimationFrame(clock);await analyze();let left=fixedEnd(),ops=0,total=cells.filter(v=>v===1||v===2).length;while(running){let hole=firstHole(left);if(hole<0)break;let src=nextUsed(hole+1);if(src<0)break;let len=Math.min(runLength(src),1+Math.floor(Math.random()*7));file=names[(fileId[src]>=0?fileId[src]:ops)%names.length];phase='Reading';for(let j=0;j<len&&src+j<N;j++){read=src+j;write=-1;draw();beep(300+(j%4)*40);await wait(24+Math.random()*55)}phase='Writing';for(let j=0;j<len&&hole+j<src;j++){read=-1;write=hole+j;draw();beep(560+(j%4)*55);await wait(18+Math.random()*45);cells[hole+j]=1;fileId[hole+j]=fileId[src+j];cells[src+j]=0;fileId[src+j]=-1;moved++;draw()}read=write=-1;ops++;progress=Math.min(99,8+Math.round(moved/Math.max(1,total)*92));if(ops%14===0){pass++;phase='Updating';draw();await wait(180+Math.random()*260)}else if(Math.random()<.18){phase='Locating';draw();await wait(90+Math.random()*160)}left=hole+len}running=false;cancelAnimationFrame(timer);read=write=scan=-1;phase='Complete';progress=100;start.textContent='START';beep(900,.12);draw()}
function clock(now){if(!running)return;elapsed+=now-last;last=now;draw();timer=requestAnimationFrame(clock)}
start.onclick=run;reset.onclick=init;soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'SOUND ON':'SOUND OFF';if(sound)beep(700,.06)};document.addEventListener('keydown',e=>{if(e.key==='Enter')run();if(e.key==='Escape'){running=false;phase='Stopped';start.textContent='START';draw()}if(e.key==='F5')init()});c.addEventListener('pointerup',()=>running?null:run());addEventListener('resize',()=>{if(!running)init()});init();
})();
</script></body></html>
