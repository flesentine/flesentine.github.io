<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#071018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Defrag" />
  <title>Defrag</title>
  <style>
    :root {--bg:#071018;--panel:#0d1b27;--panel2:#102534;--text:#e9f6ff;--muted:#8ba6b8;--green:#38d996;--blue:#46a6ff;--red:#ff5e6c;--yellow:#ffd166;--purple:#a98bff;--cell:#173243}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:12px;max-width:820px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.drive{width:34px;height:26px;border:2px solid #6fd5ff;border-radius:5px;position:relative;box-shadow:0 0 18px #46a6ff55 inset}.drive:after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:3px;background:#6fd5ff;border-radius:4px}.drive i{position:absolute;right:4px;top:4px;width:5px;height:5px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green)}h1{font-size:18px;letter-spacing:.12em;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}.iconBtn{border:1px solid #24495e;background:#0c1c27;border-radius:10px;min-width:44px;height:44px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #1e4054;border-radius:12px;padding:9px 10px;min-width:0}.label{color:var(--muted);font-size:10px}.value{font-size:17px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.good{color:var(--green)}.main{min-height:0;background:linear-gradient(180deg,#0b1923,#08131b);border:1px solid #1d3d50;border-radius:16px;padding:10px;display:grid;grid-template-rows:auto 1fr auto;gap:9px;box-shadow:0 16px 50px #0008}.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.gridWrap{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.grid{width:100%;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;touch-action:none;user-select:none}.cell{aspect-ratio:1;border-radius:3px;background:var(--cell);border:1px solid #24495d33;transition:transform .16s ease,background .22s ease,opacity .22s ease,box-shadow .22s ease}.cell.used{background:var(--blue);box-shadow:0 0 7px #46a6ff55}.cell.fragment{background:var(--red);box-shadow:0 0 7px #ff5e6c55}.cell.system{background:var(--purple)}.cell.moving{transform:scale(.74);opacity:.65;background:var(--yellow);box-shadow:0 0 12px #ffd166aa}.cell.done{background:var(--green);box-shadow:0 0 8px #38d99677}.cell.selected{outline:2px solid white;transform:scale(.82)}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:var(--muted)}.key{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:2px}.free{background:var(--cell)}.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}.btn{border:1px solid #2b5870;background:#102736;border-radius:13px;min-height:50px;font-weight:700}.btn.primary{background:linear-gradient(180deg,#1cbb82,#118a60);border-color:#42dda1;color:#04150e;box-shadow:0 8px 25px #0fa56c33}.btn:active{transform:translateY(1px);filter:brightness(.9)}.btn:disabled{opacity:.45}.progressShell{height:8px;background:#132b3a;border-radius:99px;overflow:hidden;border:1px solid #23495e}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .2s linear}.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#e9f6ff;color:#071018;padding:10px 14px;border-radius:99px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-height:690px){.app{gap:7px;padding-top:7px;padding-bottom:7px}.stat{padding:6px 8px}.value{font-size:14px}.controls .btn{min-height:44px}.grid{gap:2px}.main{padding:8px}}@media(min-width:650px){.grid{grid-template-columns:repeat(16,1fr);max-width:680px}.cell{border-radius:4px}}
  </style>
</head>
<body>
<main class="app"><header><div class="brand"><div class="drive"><i></i></div><div><h1>DEFRAG</h1><div class="sub">MOBILE DISK OPTIMIZER</div></div></div><button id="soundBtn" class="iconBtn" aria-label="Toggle sound">🔊</button></header><section class="stats"><div class="stat"><div class="label">FRAGMENTED</div><div id="fragValue" class="value">--%</div></div><div class="stat"><div class="label">FILES MOVED</div><div id="movedValue" class="value">0</div></div><div class="stat"><div class="label">DRIVE HEALTH</div><div id="healthValue" class="value good">GOOD</div></div></section><section class="main"><div class="topline"><span>LOCAL DRIVE (C:)</span><span id="status">READY</span></div><div class="gridWrap"><div id="grid" class="grid" aria-label="Disk block map"></div></div><div><div class="progressShell"><div id="progress" class="progress"></div></div><div class="legend" style="margin-top:8px"><span class="key"><i class="dot free"></i>Free</span><span class="key"><i class="dot" style="background:var(--blue)"></i>File</span><span class="key"><i class="dot" style="background:var(--red)"></i>Fragment</span><span class="key"><i class="dot" style="background:var(--purple)"></i>System</span></div></div></section><section class="controls"><button id="shuffleBtn" class="btn">SCRAMBLE</button><button id="startBtn" class="btn primary">START DEFRAG</button><button id="modeBtn" class="btn">AUTO</button></section></main><div id="toast" class="toast">Drive optimized</div>
<script>
(()=>{const gridEl=document.querySelector('#grid'),startBtn=document.querySelector('#startBtn'),shuffleBtn=document.querySelector('#shuffleBtn'),modeBtn=document.querySelector('#modeBtn'),soundBtn=document.querySelector('#soundBtn'),statusEl=document.querySelector('#status'),fragEl=document.querySelector('#fragValue'),movedEl=document.querySelector('#movedValue'),healthEl=document.querySelector('#healthValue'),progressEl=document.querySelector('#progress'),toastEl=document.querySelector('#toast');let cells=[],data=[],running=false,manual=false,sound=true,selected=null,moved=0,audioCtx;const cellCount=()=>matchMedia('(min-width:650px)').matches?128:120;function beep(freq=520,duration=.045){if(!sound)return;try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch{}}function makeDisk(){const n=cellCount();data=Array(n).fill('free');const systemCount=8,usedCount=Math.floor(n*.62);for(let i=0;i<systemCount;i++)data[i]='system';let placed=0;while(placed<usedCount){const i=systemCount+Math.floor(Math.random()*(n-systemCount));if(data[i]==='free'){data[i]=Math.random()<.34?'fragment':'used';placed++}}moved=0;selected=null;render();updateStats();progressEl.style.width='0%';statusEl.textContent='READY'}function render(){if(cells.length!==data.length){gridEl.innerHTML='';cells=data.map((_,i)=>{const d=document.createElement('div');d.className='cell';d.dataset.i=i;d.addEventListener('pointerdown',onCellTap);gridEl.appendChild(d);return d})}cells.forEach((c,i)=>{c.className='cell '+data[i]+(selected===i?' selected':'')})}function fragmentation(){let breaks=0,used=0,seenFree=false;for(const x of data){if(x==='free')seenFree=true;else if(x!=='system'){used++;if(seenFree)breaks++}}return used?Math.round(breaks/used*100):0}function updateStats(){const f=fragmentation();fragEl.textContent=f+'%';movedEl.textContent=moved;healthEl.textContent=f<8?'EXCELLENT':f<22?'GOOD':f<40?'FAIR':'POOR';healthEl.style.color=f<22?'var(--green)':f<40?'var(--yellow)':'var(--red)'}function targetLayout(){const system=data.filter(x=>x==='system').length,files=data.filter(x=>x==='used'||x==='fragment').length;return data.map((_,i)=>i<system?'system':i<system+files?'done':'free')}const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function autoDefrag(){if(running)return;running=true;manual=false;lock(true);statusEl.textContent='ANALYZING';beep(330,.08);await sleep(450);const target=targetLayout(),changes=[];for(let i=0;i<data.length;i++)if(data[i]!==target[i])changes.push(i);statusEl.textContent='OPTIMIZING';for(let step=0;step<changes.length;step++){const i=changes[step];cells[i].classList.add('moving');beep(420+step%7*45,.025);await sleep(28);data[i]=target[i];moved++;render();updateStats();progressEl.style.width=Math.round((step+1)/changes.length*100)+'%'}finish()}function finish(){running=false;lock(false);statusEl.textContent='COMPLETE';progressEl.style.width='100%';updateStats();beep(740,.12);navigator.vibrate?.([30,40,60]);toast('Drive optimized')}function lock(v){startBtn.disabled=v;shuffleBtn.disabled=v;modeBtn.disabled=v;startBtn.textContent=v?'WORKING…':'START DEFRAG'}function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1500)}function onCellTap(e){if(running||!manual)return;const i=+e.currentTarget.dataset.i;if(selected===null){if(data[i]==='used'||data[i]==='fragment'||data[i]==='done'){selected=i;beep(600);render()}}else{if(data[i]==='free'){data[i]=data[selected]==='done'?'used':data[selected];data[selected]='free';moved++;selected=null;beep(780);render();updateStats();const f=fragmentation();progressEl.style.width=Math.max(0,100-f*2)+'%';if(f===0)finish()}else{selected=null;render()}}}startBtn.addEventListener('click',()=>manual?toast('Tap a file, then a free block'):autoDefrag());shuffleBtn.addEventListener('click',()=>{if(!running){makeDisk();beep(250,.06)}});modeBtn.addEventListener('click',()=>{if(running)return;manual=!manual;modeBtn.textContent=manual?'MANUAL':'AUTO';startBtn.textContent=manual?'HOW TO PLAY':'START DEFRAG';statusEl.textContent=manual?'TAP TO MOVE':'READY';toast(manual?'Tap a file, then a free block':'Automatic mode')});soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=sound?'🔊':'🔇';if(sound)beep(600)});addEventListener('resize',()=>{const n=cellCount();if(n!==data.length)makeDisk()});document.addEventListener('touchmove',e=>{if(e.target.closest('.grid'))e.preventDefault()},{passive:false});makeDisk()})();
</script>
</body>
</html>
