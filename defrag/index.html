<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#5555ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MS-DOS Defrag"><title>Microsoft Defragmenter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5555ff}body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overscroll-behavior:none}#stage{position:relative;background:#5555ff;touch-action:manipulation;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#5555ff}#controls{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;opacity:0;z-index:2}#stage:active #controls,#controls:focus-within{opacity:1}button{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid #000;background:#fff;color:#000;padding:9px 10px;border-radius:0;box-shadow:2px 2px #000;min-width:78px}@media(hover:hover){#stage:hover #controls{opacity:1}}@media(orientation:landscape){#stage{width:min(100vw,calc(100dvh * 1.8));height:min(100dvh,calc(100vw / 1.8))}}@media(orientation:portrait){#stage{width:100vw;height:100dvh}}
</style></head><body><div id="stage"><canvas id="dos" width="720" height="400" aria-label="MS-DOS Defragmenter simulation"></canvas><div id="controls"><button id="start">START</button><button id="reset">SCRAMBLE</button><button id="sound">SOUND ON</button></div></div>
<script>
(()=>{
const c=document.getElementById('dos'),x=c.getContext('2d',{alpha:false});
const start=document.getElementById('start'),reset=document.getElementById('reset'),soundBtn=document.getElementById('sound');
const P={black:'#000000',blue:'#5555ff',white:'#ffffff',yellow:'#ffff55',red:'#aa0000',cyan:'#55ffff'};
let CW=8,CH=16,COLS=90,ROWS=25,mapW=86,mapH=17,mapX=2,mapY=2,N=1462;
const names=['COMMAND.COM','AUTOEXEC.BAT','CONFIG.SYS','HIMEM.SYS','EMM386.EXE','SMARTDRV.EXE','DOSKEY.COM','MOUSE.COM','QBASIC.EXE','EDIT.COM','DEFRAG.EXE','CHKDSK.EXE','MEM.EXE','MODE.COM','ANSI.SYS','README.TXT','WIN.COM','KRNL386.EXE','GDI.EXE','USER.EXE'];
let cells=[],fileId=[],running=false,sound=true,read=-1,write=-1,scan=-1,progress=0,moved=0,elapsed=0,last=0,file='COMMAND.COM',phase='Ready',timer=0,audio;
function layout(){const p=matchMedia('(orientation:portrait)').matches;COLS=p?64:90;ROWS=p?Math.max(42,Math.round(COLS*innerHeight/innerWidth/2)):25;CW=8;CH=16;mapW=COLS-4;mapH=ROWS-8;mapX=2;mapY=2;N=mapW*mapH;c.width=COLS*CW;c.height=ROWS*CH}
function font(){x.font='16px "Courier New",monospace';x.textBaseline='top';x.textAlign='left'}
function cell(ch,col=P.white,bg=P.blue,cx=0,cy=0){x.fillStyle=bg;x.fillRect(cx*CW,cy*CH,CW,CH);x.fillStyle=col;font();x.fillText(ch,cx*CW,cy*CH-1)}
function text(s,cx,cy,col=P.white,bg=P.blue,max=COLS){for(let i=0;i<Math.min(s.length,max);i++)cell(s[i],col,bg,cx+i,cy)}
function fill(col=P.blue){x.fillStyle=col;x.fillRect(0,0,c.width,c.height)}
function box(x0,y0,w,h,title=''){text('┌'+'─'.repeat(w-2)+'┐',x0,y0);for(let y=1;y<h-1;y++){text('│',x0,y0+y);text('│',x0+w-1,y0+y)}text('└'+'─'.repeat(w-2)+'┘',x0,y0+h-1);if(title)text(' '+title+' ',x0+2,y0)}
function tile(i,cx,cy){x.fillStyle=P.blue;x.fillRect(cx*CW,cy*CH,CW,CH);if(i===read){x.fillStyle=P.white;x.fillRect(cx*CW,cy*CH,CW,CH);cell('r',P.black,P.white,cx,cy);return}if(i===write){x.fillStyle=P.red;x.fillRect(cx*CW,cy*CH,CW,CH);cell('W',P.white,P.red,cx,cy);return}if(i===scan){cell('·',P.white,P.blue,cx,cy);return}const v=cells[i];if(v===0)return;if(v===4){cell('X',P.yellow,P.blue,cx,cy);return}if(v===3){cell('B',P.white,P.blue,cx,cy);return}x.fillStyle=P.white;x.fillRect(cx*CW+1,cy*CH+2,CW-2,CH-4);x.fillStyle=P.blue;x.fillRect(cx*CW+3,cy*CH+6,2,4)}
function init(){layout();cells=Array(N).fill(0);fileId=Array(N).fill(-1);for(let i=0;i<mapW;i++)cells[i]=4;let pos=mapW,id=0;while(pos<N){if(Math.random()<.22){pos+=1+Math.floor(Math.random()*5);continue}let len=2+Math.floor(Math.random()*10);for(let j=0;j<len&&pos<N;j++,pos++){cells[pos]=Math.random()<.012?3:1;fileId[pos]=id}id=(id+1)%names.length;if(Math.random()<.38)pos+=1+Math.floor(Math.random()*4)}read=write=scan=-1;progress=moved=elapsed=0;phase='Ready';running=false;file=names[0];start.textContent='START';draw()}
function draw(){fill();const p=COLS===64;text(' Optimize ',2,0,P.black,P.white);text('Esc=Stop',COLS-10,0,P.white,P.black);for(let i=0;i<N;i++)tile(i,mapX+i%mapW,mapY+Math.floor(i/mapW));const sy=mapH+3;if(p){box(3,sy,COLS-6,5,'Status');text('Cluster '+String(Math.max(2,Math.round(progress*N/100))).padStart(5)+'      '+String(progress).padStart(3)+'%',5,sy+1);text('Elapsed Time: '+fmt(elapsed),14,sy+2);text('Full Optimization',17,sy+3);text('■ Used  r Read  W Write  B Bad  X Fixed',2,sy+5)}else{box(5,sy,53,5,'Status');box(61,sy,24,5,'Legend');text('Cluster '+String(Math.max(2,Math.round(progress*N/100))).padStart(5),7,sy+1);text(String(progress).padStart(3)+'%',51,sy+1);text('Elapsed Time: '+fmt(elapsed),19,sy+2);text('Full Optimization',21,sy+3);text('■ - Used',63,sy+1);text('r - Reading',63,sy+2);text('W - Writing',63,sy+3)}text(running?phase+' '+file:'Press ENTER to begin optimization',0,ROWS-1,P.red,P.white,COLS-18);text('Microsoft Defrag',COLS-17,ROWS-1,P.white,P.blue,17)}
function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function beep(f=420,d=.02){if(!sound)return;try{audio ||= new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.02;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));function fixedEnd(){let i=0;while(i<N&&cells[i]===4)i++;return i}function firstHole(from){for(let i=from;i<N;i++)if(cells[i]===0)return i;return -1}function nextUsed(from){for(let i=from;i<N;i++)if(cells[i]===1)return i;return -1}function runLength(s){let id=fileId[s],n=0;while(s+n<N&&fileId[s+n]===id&&cells[s+n]===1)n++;return Math.max(1,n)}
async function analyze(){phase='Analyzing';for(let i=0;i<N;i+=Math.max(1,Math.floor(mapW/4))){scan=i;progress=Math.min(8,Math.round(i/N*8));draw();beep(220+(i%5)*25,.01);await wait(16+Math.random()*22)}scan=-1;draw();await wait(180)}
async function run(){if(running)return;running=true;start.textContent='RUNNING';last=performance.now();timer=requestAnimationFrame(clock);await analyze();let left=fixedEnd(),ops=0,total=cells.filter(v=>v===1).length;while(running){let hole=firstHole(left);if(hole<0)break;let src=nextUsed(hole+1);if(src<0)break;let len=Math.min(runLength(src),1+Math.floor(Math.random()*7));file=names[(fileId[src]>=0?fileId[src]:ops)%names.length];phase='Reading';for(let j=0;j<len&&src+j<N;j++){read=src+j;write=-1;draw();beep(300+(j%4)*40);await wait(22+Math.random()*45)}phase='Writing';for(let j=0;j<len&&hole+j<src;j++){read=-1;write=hole+j;draw();beep(560+(j%4)*55);await wait(16+Math.random()*34);cells[hole+j]=1;fileId[hole+j]=fileId[src+j];cells[src+j]=0;fileId[src+j]=-1;moved++;draw()}read=write=-1;ops++;progress=Math.min(99,8+Math.round(moved/Math.max(1,total)*92));if(ops%12===0){phase='Updating';draw();await wait(140+Math.random()*180)}else if(Math.random()<.16){phase='Locating';draw();await wait(70+Math.random()*120)}left=hole+len}running=false;cancelAnimationFrame(timer);read=write=scan=-1;phase='Complete';progress=100;start.textContent='START';beep(900,.12);draw()}
function clock(now){if(!running)return;elapsed+=now-last;last=now;draw();timer=requestAnimationFrame(clock)}
start.onclick=run;reset.onclick=init;soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'SOUND ON':'SOUND OFF';if(sound)beep(700,.06)};document.addEventListener('keydown',e=>{if(e.key==='Enter')run();if(e.key==='Escape'){running=false;phase='Stopped';start.textContent='START';draw()}if(e.key==='F5')init()});c.addEventListener('pointerup',()=>running?null:run());addEventListener('resize',()=>{if(!running)init()});init();
})();
</script></body></html>
