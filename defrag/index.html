<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#5555ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Microsoft Defrag</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5555ff}body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}#stage{position:relative;background:#5555ff;overflow:hidden;touch-action:manipulation}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}#controls{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;opacity:0;z-index:2}#stage:active #controls,#controls:focus-within{opacity:1}button{font:700 12px monospace;border:1px solid #000;background:#fff;color:#000;padding:8px;border-radius:0}@media(orientation:landscape){#stage{width:min(100vw,calc(100dvh * 1.8));height:min(100dvh,calc(100vw / 1.8))}}@media(orientation:portrait){#stage{width:100vw;height:100dvh}}</style></head><body><div id="stage"><canvas id="dos"></canvas><div id="controls"><button id="start">START</button><button id="reset">SCRAMBLE</button><button id="sound">SOUND ON</button></div></div><script>(()=>{const c=document.getElementById('dos'),g=c.getContext('2d',{alpha:false}),start=document.getElementById('start'),reset=document.getElementById('reset'),soundBtn=document.getElementById('sound');const pal=['#000000','#0000aa','#00aa00','#00aaaa','#aa0000','#aa00aa','#aa5500','#aaaaaa','#555555','#5555ff','#55ff55','#55ffff','#ff5555','#ff55ff','#ffff55','#ffffff'];const BG=9,W=15,K=0,Y=14,R=4,CY=11;let CW=8,CH=16,COLS=90,ROWS=25,mapW=86,mapH=16,mapX=2,mapY=2,N=0,cells=[],ids=[],running=false,sound=true,read=-1,write=-1,scan=-1,progress=0,moved=0,elapsed=0,last=0,phase='Ready',file='COMMAND.COM',timer=0,audio;const names=['COMMAND.COM','AUTOEXEC.BAT','CONFIG.SYS','HIMEM.SYS','EMM386.EXE','SMARTDRV.EXE','DOSKEY.COM','MOUSE.COM','QBASIC.EXE','EDIT.COM','DEFRAG.EXE','CHKDSK.EXE','MEM.EXE','MODE.COM','ANSI.SYS','README.TXT','WIN.COM','KRNL386.EXE','GDI.EXE','USER.EXE'];function layout(){const p=matchMedia('(orientation:portrait)').matches;COLS=p?60:90;ROWS=p?Math.max(42,Math.round(COLS*innerHeight/innerWidth/2)):25;CW=8;CH=16;mapW=COLS-4;mapH=ROWS-9;N=mapW*mapH;c.width=COLS*CW;c.height=ROWS*CH}function font(){g.font=CH+'px monospace';g.textBaseline='top'}function cell(ch,fg=W,bg=BG,x=0,y=0){g.fillStyle=pal[bg];g.fillRect(x*CW,y*CH,CW,CH);g.fillStyle=pal[fg];font();g.fillText(ch,x*CW,y*CH-1)}function text(s,x,y,fg=W,bg=BG,max=COLS){for(let i=0;i<Math.min(s.length,max);i++)cell(s[i],fg,bg,x+i,y)}function fill(){g.fillStyle=pal[BG];g.fillRect(0,0,c.width,c.height)}function box(x,y,w,h,title=''){text('┌'+'─'.repeat(w-2)+'┐',x,y);for(let j=1;j<h-1;j++){cell('│',W,BG,x,y+j);cell('│',W,BG,x+w-1,y+j)}text('└'+'─'.repeat(w-2)+'┘',x,y+h-1);if(title)text(' '+title+' ',x+2,y)}function init(){layout();cells=Array(N).fill(0);ids=Array(N).fill(-1);for(let i=0;i<mapW;i++)cells[i]=4;let p=mapW,id=0;while(p<N){if(Math.random()<.2){let gap=1+Math.floor(Math.random()*5);for(let j=0;j<gap&&p<N;j++,p++)cells[p]=0;continue}let len=2+Math.floor(Math.random()*11);for(let j=0;j<len&&p<N;j++,p++){cells[p]=Math.random()<.012?3:(Math.random()<.34?2:1);ids[p]=id}id=(id+1)%names.length}read=write=scan=-1;progress=moved=elapsed=0;phase='Ready';file=names[0];running=false;start.textContent='START';draw()}function clusterGlyph(v){if(v===4)return'X';if(v===3)return'B';if(v===2)return'░';if(v===1)return'□';return'·'}function clusterColor(v){return v===4?Y:W}function draw(){fill();const portrait=COLS===60;text(' Optimize ',0,0,W,K);text('Esc=Stop Defrag',COLS-15,0,K,W);for(let i=0;i<N;i++){const x=mapX+i%mapW,y=mapY+Math.floor(i/mapW);let ch=clusterGlyph(cells[i]),fg=clusterColor(cells[i]),bg=BG;if(i===scan){ch='·';fg=Y}else if(i===read){ch='r';fg=K;bg=W}else if(i===write){ch='W';fg=W;bg=R}cell(ch,fg,bg,x,y)}const sy=mapH+3;if(portrait){box(3,sy,COLS-6,5,'Status');text('Cluster '+String(Math.max(2,Math.round(progress*N/100))).padStart(5)+'   '+String(progress).padStart(3)+'%',5,sy+1);text('Elapsed Time: '+fmt(elapsed),10,sy+2);text('Full Optimization',14,sy+3);text('□ Used  · Unused  r Read  W Write  B Bad  X Fixed',2,sy+5)}else{box(5,sy,52,5,'Status');box(59,sy,29,5,'Legend');text('Cluster '+String(Math.max(2,Math.round(progress*N/100))).padStart(5),7,sy+1);text(String(progress).padStart(3)+'%',49,sy+1);text('Elapsed Time: '+fmt(elapsed),14,sy+2);text('Full Optimization',20,sy+3);text('□ - Used     · - Unused',61,sy+1);text('r - Reading  W - Writing',61,sy+2);text('B - Bad      X - Unmovable',61,sy+3)}text((running?phase+' '+file:'Press ENTER to begin optimization').padEnd(COLS),0,ROWS-1,R,W);if(!portrait)text('Microsoft Defrag',COLS-18,ROWS-1,K,W)}function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function beep(f=420,d=.02){if(!sound)return;try{audio||=new(AudioContext||webkitAudioContext)();let o=audio.createOscillator(),a=audio.createGain();o.type='square';o.frequency.value=f;a.gain.value=.018;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}const wait=ms=>new Promise(r=>setTimeout(r,ms));function fixedEnd(){let i=0;while(i<N&&cells[i]===4)i++;return i}function hole(from){for(let i=from;i<N;i++)if(cells[i]===0)return i;return-1}function used(from){for(let i=from;i<N;i++)if(cells[i]===1||cells[i]===2)return i;return-1}function runLen(s){const id=ids[s];let n=0;while(s+n<N&&ids[s+n]===id&&(cells[s+n]===1||cells[s+n]===2))n++;return Math.max(1,n)}async function analyze(){phase='Analyzing';for(let i=0;i<N;i+=Math.max(1,Math.floor(mapW/4))){scan=i;progress=Math.min(7,Math.round(i/N*7));draw();beep(220+(i%5)*20,.01);await wait(18+Math.random()*22)}scan=-1;await wait(180)}async function run(){if(running)return;running=true;start.textContent='RUNNING';last=performance.now();timer=requestAnimationFrame(clock);await analyze();let left=fixedEnd(),ops=0,total=cells.filter(v=>v===1||v===2).length;while(running){let dst=hole(left);if(dst<0)break;let src=used(dst+1);if(src<0)break;let len=Math.min(runLen(src),1+Math.floor(Math.random()*6));file=names[(ids[src]>=0?ids[src]:ops)%names.length];phase='Reading';for(let j=0;j<len;j++){read=src+j;write=-1;draw();beep(300+j*30);await wait(20+Math.random()*38)}phase='Writing';for(let j=0;j<len&&dst+j<src;j++){read=-1;write=dst+j;draw();beep(560+j*35);await wait(16+Math.random()*32);cells[dst+j]=1;ids[dst+j]=ids[src+j];cells[src+j]=0;ids[src+j]=-1;moved++;draw()}read=write=-1;ops++;progress=Math.min(99,7+Math.round(moved/Math.max(1,total)*93));if(ops%12===0){phase='Updating';draw();await wait(160+Math.random()*220)}left=dst+len}running=false;cancelAnimationFrame(timer);phase='Complete';progress=100;read=write=scan=-1;start.textContent='START';beep(900,.12);draw()}function clock(now){if(!running)return;elapsed+=now-last;last=now;draw();timer=requestAnimationFrame(clock)}start.onclick=run;reset.onclick=init;soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'SOUND ON':'SOUND OFF';if(sound)beep(700,.06)};c.addEventListener('pointerup',()=>running?null:run());addEventListener('resize',()=>{if(!running)init()});document.addEventListener('keydown',e=>{if(e.key==='Enter')run();if(e.key==='Escape'){running=false;phase='Stopped';start.textContent='START';draw()}if(e.key==='F5')init()});init()})()</script></body></html>
